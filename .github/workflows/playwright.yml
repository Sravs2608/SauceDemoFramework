# Role: the CI pipeline. GitHub runs this file on its own Linux machines.
#
#   On every push and pull request to main -> job "smoke":
#       lint, type-check, then only the @smoke tests on every browser project.
#
#   When started by hand ("Run workflow")  -> job "regression" + job "merge-reports":
#       the FULL suite is split into 4 parts ("shards"). Four machines run one part each
#       at the same time, so the suite finishes in roughly a quarter of the time. Each
#       machine saves its results as a "blob" report; the last job downloads the four
#       blobs and merges them into ONE normal HTML report.
#
# Required one-time setup in GitHub: Settings -> Secrets and variables -> Actions ->
# New repository secret, name SAUCE_PASSWORD. Without it every run stops in global setup
# with: Missing required setting "SAUCE_PASSWORD".
#
# Note: the two visual tests (USR-04) are skipped here, because their baseline screenshot
# was made on Windows and these machines run Linux.
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Settings shared by all jobs. CI=true is set by GitHub automatically; the Playwright
# config uses it for retries and workers.
env:
  BASE_URL: https://www.saucedemo.com
  STANDARD_USER: standard_user
  LOCKED_OUT_USER: locked_out_user
  PROBLEM_USER: problem_user
  PERFORMANCE_GLITCH_USER: performance_glitch_user
  ERROR_USER: error_user
  VISUAL_USER: visual_user
  SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

jobs:
  smoke:
    name: Smoke
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Install browsers and their system libraries
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run smoke tests
        run: npx playwright test --grep @smoke

      - name: Upload HTML report
        # Runs even when a test step failed: that is when the report matters most.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  regression:
    name: Regression (shard ${{ matrix.shard }} of 4)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let the other shards finish even if one of them has failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Install browsers and their system libraries
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run this shard of the full suite
        # --reporter on the command line replaces the reporters from the config:
        # "blob" saves raw results for merging, "list" prints progress in the log.
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob,list

      - name: Upload this shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    name: Merge shard reports
    # Runs after all shards, also when some of them had failing tests.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the blob reports of all shards into one folder
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
